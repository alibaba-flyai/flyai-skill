name: DingTalk daily unanswered issues/PRs

# Remind daily about all open issues/PRs without a reply from another person.
on:
  schedule:
    # 09:17 Asia/Shanghai (01:17 UTC). GitHub may delay scheduled runs.
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  issues: read
  pull-requests: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Scan open unanswered issues/PRs and push to DingTalk
        uses: actions/github-script@v7
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
        with:
          script: |
            const webhook = process.env.DINGTALK_WEBHOOK;
            if (!webhook) {
              core.setFailed('Missing DINGTALK_WEBHOOK secret. Add it under repo Settings -> Secrets and variables -> Actions.');
              return;
            }

            const { owner, repo } = context.repo;

            // Scan all open items, regardless of age, so delayed runs cannot create gaps.
            const items = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            const unanswered = [];
            for (const item of items) {
              // Author follow-ups and automated comments do not count as a human reply.
              const isReply = entry => entry.user &&
                entry.user.id !== item.user.id &&
                entry.user.type !== 'Bot' &&
                Boolean(entry.body?.trim());
              const params = { owner, repo, per_page: 100 };
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...params, issue_number: item.number,
              });
              if (comments.some(isReply)) continue;
              if (item.pull_request) {
                const reviews = await github.paginate(github.rest.pulls.listReviews, {
                  ...params, pull_number: item.number,
                });
                // Submitted approvals/change requests count even without a review body.
                const reviewed = reviews.some(review => review.user &&
                  review.user.id !== item.user.id && review.user.type !== 'Bot' &&
                  ['APPROVED', 'CHANGES_REQUESTED', 'COMMENTED'].includes(review.state));
                if (reviewed) continue;
                const reviewComments = await github.paginate(github.rest.pulls.listReviewComments, {
                  ...params, pull_number: item.number,
                });
                if (reviewComments.some(isReply)) continue;
              }
              unanswered.push(item);
            }
            const issues = unanswered.filter(i => !i.pull_request);
            const prs = unanswered.filter(i => i.pull_request);

            core.info(`Open unanswered: ${issues.length} issue(s), ${prs.length} PR(s)`);

            if (issues.length === 0 && prs.length === 0) {
              core.info('No open unanswered items, skipping push.');
              return;
            }

            const lines = [];
            lines.push(`## [SafetyAI] Open unanswered GitHub items - ${owner}/${repo}`);
            lines.push(`${issues.length} issue(s), ${prs.length} PR(s) awaiting a reply`);
            if (issues.length) {
              lines.push('', '### Unanswered issues');
              for (const i of issues) {
                lines.push(`- [#${i.number} ${i.title}](${i.html_url}) - @${i.user.login}`);
              }
            }
            if (prs.length) {
              lines.push('', '### Unanswered PRs');
              for (const p of prs) {
                lines.push(`- [#${p.number} ${p.title}](${p.html_url}) - @${p.user.login}`);
              }
            }
            const text = lines.join('\n');

            const body = {
              msgtype: 'markdown',
              markdown: {
                title: `[SafetyAI] Unanswered issues/PRs - ${owner}/${repo}`,
                text,
              },
            };

            const res = await fetch(webhook, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            });
            const resText = await res.text();
            core.info(`DingTalk response: ${res.status} ${resText}`);

            let parsed;
            try {
              parsed = JSON.parse(resText);
            } catch (e) {
              core.setFailed(`Cannot parse DingTalk response: ${resText}`);
              return;
            }
            if (!res.ok || parsed.errcode !== 0) {
              core.setFailed(`DingTalk push failed: ${resText}`);
            }
